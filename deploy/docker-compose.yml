services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      # Wait for the bucket-creation one-shot to finish. This also tells
      # `up --wait` that s3-init exiting 0 is expected (not a failure).
      s3-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    ports:
      - "8000:8000"
    # The api container is the single migration owner (start.sh runs migrate +
    # ensure_admin_user). This healthcheck only flips to healthy once gunicorn
    # is serving, i.e. after migrations finish — so `up --wait` can block on it
    # instead of racing a second migrate. No curl in the runtime image; use Python.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/projects/')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Same image as api but with pytest/factory-boy/ruff installed. Used by
  # `make test-fast`, `make test-slow`, `make lint`. Doesn't expose ports —
  # runs one-off commands. The backend source is bind-mounted so test runs
  # see local edits without an image rebuild and `lint-fix` writes back to
  # the working tree.
  api-dev:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    env_file: ../.env
    volumes:
      - ../backend:/app:rw
      - api-dev-venv:/app/.venv   # don't let the bind mount blow away the venv
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    profiles: ["dev"]   # not started by `docker compose up`

  spa:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:8080"
    # /healthz is answered directly by nginx (not proxied to api), so this
    # only confirms the SPA container itself is alive. No curl in the
    # nginx-unprivileged alpine base image; use the bundled busybox wget.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Node-based image for `make lint` and `make test-frontend`. Uses node:26.13.1 directly
  # (the production spa image is nginx-only). Bind-mounts the source so lint --fix
  # writes back to the working tree; named volume preserves node_modules across runs.
  spa-dev:
    image: node:26.13.1-alpine
    working_dir: /app
    volumes:
      - ../frontend:/app:rw
      - spa-dev-node-modules:/app/node_modules
      - ../VERSION:/VERSION:ro
    profiles: ["dev"]

  db:
    image: postgres:16.16
    environment:
      POSTGRES_DB: inspectre
      POSTGRES_USER: inspectre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspectre"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible object store (SeaweedFS). Static identity from seaweedfs-s3.json,
  # matching S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY in .env.
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    entrypoint: ["weed"]
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "9000:8333"
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8333/status"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # One-shot: create the bucket with boto3 from the api image (path-style).
  s3-init:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    env_file: ../.env
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, sys, time, boto3
        from botocore.config import Config
        endpoint = os.environ.get("S3_ENDPOINT_URL")
        if not endpoint:
            print("S3_ENDPOINT_URL not set; assuming AWS S3, bucket must already exist - skipping creation")
            sys.exit(0)
        s3 = boto3.client("s3", endpoint_url=endpoint,
            aws_access_key_id=os.environ["S3_ACCESS_KEY_ID"],
            aws_secret_access_key=os.environ["S3_SECRET_ACCESS_KEY"],
            region_name=os.environ["S3_REGION"], config=Config(s3={"addressing_style": "path"}))
        for attempt in range(30):
            try:
                s3.create_bucket(Bucket=os.environ["S3_BUCKET_NAME"])
                break
            except (s3.exceptions.BucketAlreadyOwnedByYou, s3.exceptions.BucketAlreadyExists):
                break  # volume persists across `make down`; re-runs must be idempotent
            except Exception as e:
                if attempt == 29:
                    raise
                print("retrying:", e); time.sleep(1)
        print("bucket ready")
    depends_on:
      seaweedfs:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8.1.11-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    command: celery -A inspectre worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  seaweedfs-data:
  api-dev-venv:   # named volume preserves the image's /app/.venv across bind mounts
  spa-dev-node-modules:   # cache npm install across spa-dev runs
