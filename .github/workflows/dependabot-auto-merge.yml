name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve patch/minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch/minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Must be a PAT (not GITHUB_TOKEN): merges performed with GITHUB_TOKEN
          # do not trigger other workflows, so tagpr.yml (on: push to main)
          # would never run and the release PR would go stale.
          # This workflow is triggered by dependabot[bot], so the same PAT must
          # ALSO be stored as a Dependabot secret named TAGPR_TOKEN
          # (Settings > Secrets and variables > Dependabot); Dependabot-triggered
          # runs only see Dependabot secrets, not repository secrets.
          GH_TOKEN: ${{ secrets.TAGPR_TOKEN }}
