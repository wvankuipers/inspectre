[project]
name = "inspectre"
version = "1.0.0"
description = "Visual regression testing service — Django rebuild"
requires-python = ">=3.13"

dependencies = [
    "Django>=5.2,<6",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "django-storages[s3]>=1.14",
    "boto3>=1.35",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "python-json-logger>=2.0",
    "celery[redis]>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.6",
    "pip-tools>=7.4",
]

[tool.ruff]
line-length = 120
target-version = "py313"
# Generated migrations follow Django's own formatting; don't lint them.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "inspectre.settings"
python_files = ["test_*.py"]
python_classes = ["Test*Class", "Test[A-Z]*"]
addopts = "--reuse-db --strict-markers"
markers = [
    "slow: tests that exceed ~1s individually (the comparison and race packs)",
]
filterwarnings = [
    # pytest tries to collect serializer/model classes named Test* as test classes.
    # Our test classes are named TestRunsCreate / TestProjectsList / etc.
    "ignore:cannot collect test class.*has a __init__ constructor:pytest.PytestCollectionWarning",
]
