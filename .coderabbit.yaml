# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Merge with the repository/organization UI settings instead of replacing them.
inheritance: true

reviews:
  auto_review:
    # Skip automatic reviews on Dependabot PRs. A review can still be requested
    # manually with `@coderabbitai review`.
    ignore_usernames:
      - "dependabot[bot]"
    # Skip tagpr release PRs by title: they are authored by a PAT, so username
    # matching can't identify them. The "[tagpr]" marker comes from the PR title
    # template in .github/tagpr-template.md. A review can still be requested
    # manually with `@coderabbitai review`.
    ignore_title_keywords:
      - "[tagpr] Release for"
