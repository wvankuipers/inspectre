server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 25m;   # screenshots can be large

    # Defer DNS resolution of `api` to request-time. Without this, nginx
    # resolves the upstream once at boot, fails if the api container isn't up
    # yet, and crashes the spa container.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Backend routes — proxied to the api container -----------------
    # Order matters: specific patterns before the SPA fallback.
    location /admin/ {
        set $upstream "http://api:8000";
        proxy_pass $upstream;
        include /etc/nginx/proxy.conf;
    }
    location /api/ {
        set $upstream "http://api:8000";
        proxy_pass $upstream;
        include /etc/nginx/proxy.conf;
    }
    location = /runs {
        set $upstream "http://api:8000";
        proxy_pass $upstream;
        include /etc/nginx/proxy.conf;
    }
    location = /tests {
        set $upstream "http://api:8000";
        proxy_pass $upstream;
        include /etc/nginx/proxy.conf;
    }
    location ~ ^/tests/[0-9]+$ {
        set $upstream "http://api:8000";
        proxy_pass $upstream;
        include /etc/nginx/proxy.conf;
    }
    location ~ ^/baselines/[a-z0-9-]+\.(png|json)$ {
        set $upstream "http://api:8000";
        proxy_pass $upstream;
        include /etc/nginx/proxy.conf;
    }
    # `^~` so this prefix wins over the `~* \.(js|css|...)$` regex below —
    # otherwise /static/admin/css/base.css gets served from the local SPA
    # webroot (and 404s) instead of being proxied to Django.
    location ^~ /static/ {
        set $upstream "http://api:8000";
        proxy_pass $upstream;
        include /etc/nginx/proxy.conf;
    }

    # ---- Static SPA assets ---------------------------------------------
    location ~* \.(js|css|woff2|svg|png|jpg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback --------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
