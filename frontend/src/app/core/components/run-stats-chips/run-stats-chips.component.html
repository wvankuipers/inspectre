@if (stats().passing > 0) {
  <span class="chip chip-pass">{{ stats().passing }} pass</span>
}
@if (stats().failing > 0) {
  <span class="chip chip-fail">{{ stats().failing }} fail</span>
}
@if (stats().unbaselined > 0) {
  <span class="chip chip-new">{{ stats().unbaselined }} new</span>
}
@if (stats().passing === 0 && stats().failing === 0 && stats().unbaselined === 0) {
  <span class="chip chip-none">No tests</span>
}
